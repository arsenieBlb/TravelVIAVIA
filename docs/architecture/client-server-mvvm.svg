<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; fill: white; }
      .pkg { font-size: 19px; font-weight: 700; }
      .item { font-size: 16px; }
      .small { font-size: 14px; fill: #374151; }
      .line { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #dc2626; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#f3f4f6"/>
  <text x="640" y="48" text-anchor="middle" class="title">TravelVIAVIA - MVVM and Socket Architecture</text>

  <rect x="50" y="90" width="760" height="560" rx="18" fill="#e0f2fe" stroke="#0891b2" stroke-width="4"/>
  <rect x="70" y="110" width="720" height="58" rx="14" fill="#0891b2"/>
  <text x="430" y="148" text-anchor="middle" class="label">Client</text>

  <rect x="95" y="195" width="660" height="112" rx="14" fill="#4fb3c8"/>
  <text x="425" y="230" text-anchor="middle" class="pkg">client.view</text>
  <rect x="125" y="248" width="160" height="34" rx="6" fill="#bfdbfe"/>
  <text x="205" y="270" text-anchor="middle" class="item">FXML + Controllers</text>
  <rect x="330" y="248" width="150" height="34" rx="6" fill="#bfdbfe"/>
  <text x="405" y="270" text-anchor="middle" class="item">ViewHandler</text>
  <rect x="535" y="248" width="180" height="34" rx="6" fill="#bfdbfe"/>
  <text x="625" y="270" text-anchor="middle" class="item">Admin/Booking Views</text>

  <rect x="95" y="335" width="660" height="112" rx="14" fill="#84cc16"/>
  <text x="425" y="370" text-anchor="middle" class="pkg">client.viewmodel</text>
  <rect x="140" y="390" width="170" height="34" rx="6" fill="#d9f99d"/>
  <text x="225" y="412" text-anchor="middle" class="item">ViewModels</text>
  <rect x="362" y="390" width="170" height="34" rx="6" fill="#d9f99d"/>
  <text x="447" y="412" text-anchor="middle" class="item">ViewModelFactory</text>
  <rect x="585" y="390" width="130" height="34" rx="6" fill="#d9f99d"/>
  <text x="650" y="412" text-anchor="middle" class="item">Bindings</text>

  <rect x="135" y="475" width="245" height="115" rx="14" fill="#ea580c"/>
  <text x="258" y="507" text-anchor="middle" class="pkg" fill="white">client.mediator</text>
  <rect x="165" y="528" width="80" height="34" rx="6" fill="#fed7aa"/>
  <text x="205" y="550" text-anchor="middle" class="item">Client</text>
  <rect x="270" y="528" width="82" height="34" rx="6" fill="#fed7aa"/>
  <text x="311" y="550" text-anchor="middle" class="item">ServerModel</text>

  <rect x="435" y="475" width="320" height="115" rx="14" fill="#f59e0b" opacity="0.92"/>
  <text x="595" y="507" text-anchor="middle" class="pkg">client/server contracts</text>
  <rect x="460" y="528" width="120" height="34" rx="6" fill="#fde68a"/>
  <text x="520" y="550" text-anchor="middle" class="item">client.model</text>
  <rect x="602" y="528" width="128" height="34" rx="6" fill="#fde68a"/>
  <text x="666" y="550" text-anchor="middle" class="item">server.network</text>

  <rect x="850" y="90" width="380" height="560" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
  <rect x="870" y="110" width="340" height="58" rx="14" fill="#dc2626"/>
  <text x="1040" y="148" text-anchor="middle" class="label">Server</text>

  <rect x="890" y="195" width="300" height="120" rx="14" fill="#a78bfa"/>
  <text x="1040" y="230" text-anchor="middle" class="pkg">server.mediator</text>
  <rect x="915" y="250" width="85" height="34" rx="6" fill="#ddd6fe"/>
  <text x="958" y="272" text-anchor="middle" class="item">Server</text>
  <rect x="1020" y="250" width="140" height="34" rx="6" fill="#ddd6fe"/>
  <text x="1090" y="272" text-anchor="middle" class="item">ClientHandler</text>

  <rect x="890" y="345" width="300" height="118" rx="14" fill="#f97316"/>
  <text x="1040" y="380" text-anchor="middle" class="pkg" fill="white">server.model</text>
  <rect x="960" y="405" width="160" height="34" rx="6" fill="#fed7aa"/>
  <text x="1040" y="427" text-anchor="middle" class="item">ModelManager</text>

  <rect x="890" y="492" width="300" height="118" rx="14" fill="#ef4444"/>
  <text x="1040" y="527" text-anchor="middle" class="pkg" fill="white">server.database + logging</text>
  <rect x="915" y="552" width="140" height="34" rx="6" fill="#fecaca"/>
  <text x="985" y="574" text-anchor="middle" class="item">DAO / Loader</text>
  <rect x="1070" y="552" width="95" height="34" rx="6" fill="#fecaca"/>
  <text x="1118" y="574" text-anchor="middle" class="item">ServerLogger</text>

  <path class="line" d="M405 282 L405 390"/>
  <path class="line" d="M320 422 L260 528"/>
  <path class="dash" d="M352 545 C470 545, 540 620, 665 562"/>
  <text x="500" y="625" class="small">JSON DTOs over TCP port 8800</text>
  <path class="dash" d="M730 545 C810 545, 830 270, 915 268"/>
  <path class="line" d="M1040 284 L1040 405"/>
  <path class="line" d="M1040 439 L1040 552"/>
  <path class="line" d="M1120 552 L1120 586"/>

  <text x="640" y="705" text-anchor="middle" class="small">
    Client owns JavaFX view, ViewModel, and model contracts. Server owns network DTOs, mediator, model manager, database access, and singleton logging.
  </text>
</svg>
